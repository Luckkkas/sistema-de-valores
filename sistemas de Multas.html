<!DOCTYPE html>
<html lang="pt´-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>sistema de Multas</h1>

    <p>Velocidade do carro:</p>

    <input type="number" id="txtvel">

    <input type="button" value="Verificar" onclick="calcular()">

    <div id="res"></div>

    <script>
        function calcular () {

             //pega o numero digitado
            var txtv = document.querySelector('#txtvel')
             //pega a div do resultado
            var res = document.querySelector('#res')

            //Transforma o valor em numero
            var vel = Number(txtv.value)

            //Mostra a velocidade
            res.innerHTML = `<p>Sua velocidade atual e de ${vel} Km/h.</p>`

            //Verifica se passou de 80 Km/h
            if (vel > 80) {
                res.innerHTML += '<p>Voce esta multado por excesso de velocidade!</p>'
            }
            res.innerHTML += '<p>Diriga sempre com cinto de segurança!</p>'
        }

    </script>
    
</body>
</html>
